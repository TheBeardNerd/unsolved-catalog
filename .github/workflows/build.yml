# UNSOLVED · CI
# Runs the zero-dependency build on every push and pull request, so a
# malformed entry fails here, before it can reach main or the deploy.
name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build.js
      # The build must be a pure function of the repo: same input, same
      # site, byte for byte. Build twice and compare, so nondeterminism
      # (a stray timestamp, an unsorted directory read) fails here.
      - run: |
          mv dist dist-first
          node build.js
          diff -r dist-first dist
