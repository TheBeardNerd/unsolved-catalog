# UNSOLVED · Netlify CI/CD
# A push to main builds the site from source and deploys dist/.
# The build has zero dependencies; node is all it needs.

[build]
  command = "node build.js"
  publish = "dist"

# The site is static, first-party only, and script-free; the headers say so.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Font files never change without changing name; cache them for good.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
